name: Deploy OAuth bridge to GitHub Pages

# Publica web/ en la rama gh-pages. El sitio de Pages se sirve desde esa rama
# (GitHub la activa automáticamente); no usamos el despliegue vía API de Pages
# porque el GITHUB_TOKEN no puede CREAR el sitio (Resource not accessible).
on:
  push:
    branches: ["main"]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish web/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
          publish_branch: gh-pages
