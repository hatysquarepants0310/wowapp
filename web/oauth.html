<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azeroth Companion — conectando…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; background:#0D1117; color:#E6EDF3;
         font-family:system-ui,sans-serif; text-align:center; padding:24px; }
  a.btn { background:#7C5CFF; color:#fff; text-decoration:none; padding:14px 28px;
          border-radius:10px; font-weight:600; }
  small { color:#9BA4B0; max-width:34rem; }
</style>
</head>
<body>
<h1>⚔️ Azeroth Companion</h1>
<p id="status">Volviendo a la app…</p>
<a class="btn" id="open" href="#" style="display:none">Abrir la app</a>
<small>Esta página solo reenvía el código de inicio de sesión de Battle.net a la app en tu
teléfono. No guarda ni envía nada a ningún servidor.</small>
<script>
  // Puente OAuth sin backend: Blizzard exige un redirect HTTPS, así que esta
  // página estática rebota el authorization code al esquema de la app.
  var target = "azerothcompanion://oauth" + window.location.search;
  var link = document.getElementById("open");
  link.href = target;
  window.location.replace(target);
  // Si el sistema no abre la app solo (algunos navegadores lo bloquean sin
  // gesto del usuario), mostramos el botón manual.
  setTimeout(function () {
    document.getElementById("status").textContent =
      "Si la app no se abrió sola, toca el botón:";
    link.style.display = "inline-block";
  }, 1500);
</script>
</body>
</html>
